<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWA Card Design</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f14;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 40px 20px;
    font-family: sans-serif;
  }

  /* ─── Base card ─── */
  .card {
    width: 480px;
    max-width: 100%;
    height: 120px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    padding: 16px 20px;
    gap: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  }

  /* subtle grain overlay */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.18;
    border-radius: inherit;
  }

  /* glossy top sheen */
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 100%);
    border-radius: 20px 20px 0 0;
    pointer-events: none;
  }

  /* ─── Card gradient variants ─── */
  .card-1 { background: linear-gradient(135deg, #6c2de9 0%, #00c6fb 100%); }
  .card-2 { background: linear-gradient(135deg, #f7611a 0%, #e91e8c 55%, #9b27d8 100%); }
  .card-3 { background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%); }
  .card-4 { background: linear-gradient(135deg, #fc5c7d 0%, #6a82fb 100%); }
  .card-5 { background: linear-gradient(135deg, #f6d365 0%, #fda085 50%, #f77a59 100%); }

  /* ─── Avatar ─── */
  .avatar {
    flex-shrink: 0;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    position: relative;
    z-index: 1;
  }

  .card-1 .avatar { background: radial-gradient(circle at 35% 35%, #c9a0ff, #3a0fbf); }
  .card-2 .avatar { background: radial-gradient(circle at 35% 35%, #ffd6a5, #c02060); }
  .card-3 .avatar { background: radial-gradient(circle at 35% 35%, #d4f5a0, #006655); }
  .card-4 .avatar { background: radial-gradient(circle at 35% 35%, #f9cfda, #3346c0); }
  .card-5 .avatar { background: radial-gradient(circle at 35% 35%, #fff3b0, #c0501a); }

  .avatar-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.55);
  }

  .avatar-dot {
    position: absolute;
    bottom: 4px; right: 4px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #30e87a;
    border: 2.5px solid rgba(255,255,255,0.9);
    z-index: 2;
  }

  /* ─── Content blocks ─── */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 9px;
    position: relative;
    z-index: 1;
  }

  .block {
    border-radius: 6px;
    background: rgba(255,255,255,0.28);
  }

  .block-name   { height: 14px; width: 55%; }
  .block-sub    { height: 10px; width: 38%; opacity: 0.7; }
  .block-detail { height: 9px;  width: 48%; opacity: 0.55; }

  /* milestone bar */
  .milestone-track {
    height: 6px;
    width: 90%;
    border-radius: 4px;
    background: rgba(255,255,255,0.18);
    position: relative;
    overflow: hidden;
    margin-top: 2px;
  }

  .milestone-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    border-radius: 4px;
    background: rgba(255,255,255,0.75);
  }

  .card-1 .milestone-fill { width: 65%; }
  .card-2 .milestone-fill { width: 40%; }
  .card-3 .milestone-fill { width: 85%; }
  .card-4 .milestone-fill { width: 25%; }
  .card-5 .milestone-fill { width: 55%; }

  /* ─── Action icons ─── */
  .actions {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: rgba(255,255,255,0.22);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn svg {
    width: 16px;
    height: 16px;
    fill: rgba(255,255,255,0.85);
  }

  /* ─── Floating orbs behind cards ─── */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }

  /* ─── Section label dots ─── */
  .divider {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .divider-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
    max-width: 480px;
    width: 100%;
  }
</style>
</head>
